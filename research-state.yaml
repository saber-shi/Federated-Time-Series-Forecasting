    statement: "Aligning sequence-level temporal patterns in a shared latent space before masked heterogeneous aggregation will improve forecasting stability and accuracy over plain HeteroFL."
    status: active
    motivation: "Literature suggests temporal semantic mismatch, not only parameter mismatch, is the main failure mode for model-heterogeneous time-series FL."
    parent: null
    priority: high

