# Research State — Central Project Tracking

project:
  title: "Federated Time-Series Forecasting for Cellular Traffic"
  question: "How can federated time-series forecasting for 5G base-station traffic improve the accuracy-energy tradeoff under non-IID client distributions?"
  status: active
  started: "2026-03-24"
  domain: "federated time-series forecasting"

literature:
  key_papers:
    - id: "perifanis2023fl5g"
      title: "Federated Learning for 5G Base Station Traffic Forecasting"
      authors: "Perifanis et al."
      year: 2023
      relevance: "Core benchmark and baseline federated forecasting setup used by this repository."
    - id: "perifanis2023energyaware"
      title: "Towards Energy-Aware Federated Traffic Prediction for Cellular Networks"
      authors: "Perifanis et al."
      year: 2023
      relevance: "Extends the forecasting setup with energy-consumption analysis."
