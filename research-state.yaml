  open_problems:
    - "Whether bio-inspired models retain forecasting quality under harsher temporal, quantity, and distribution skew."
    - "How aggregation choice changes the accuracy-energy tradeoff across heterogeneous clients."
    - "Which evaluation protocol best captures realistic deployment cost, not only predictive accuracy."
    - "Whether model-heterogeneous FL methods designed for generic tasks can transfer to time-series forecasting without clustering or personalization."
  evidence_gaps:
    - "A unified comparison of architectures and federated optimizers under a single energy-aware score is not yet documented in this workspace."
    - "The current repository cites prior work but does not yet maintain a reusable literature survey or experiment ledger."
    - "The repository now has a HeteroFL-style implementation, but there is no empirical evidence yet showing whether masked heterogeneous aggregation is stable for forecasting clients with different temporal dynamics."

